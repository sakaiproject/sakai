poll_import_title=Creaci\u00f3 massiva de votacions
poll_import_header=Pugeu un fitxer o escriviu a la caixa de text les votacions que voleu crear
poll_import_requirements=Requisits del fitxer o format de dades per al quadre de text
poll_import_requirements_step1=La primera fila ha de contenir les cap\u00e7aleres de columna. Cada fila seg\u00fcent representa una votaci\u00f3 amb aquestes columnes en ordre\: pregunta, descripci\u00f3, acc\u00e9s, grups, data d\u2019obertura, data de tancament, hora de tancament, opcions m\u00ednimes, opcions m\u00e0ximes, resultats, visibilitat, opci\u00f3 1, opci\u00f3 2, ...
poll_import_requirements_step2=Baixeu el fitxer d\u2019exemple de sota i useu-lo com a plantilla. Substitu\u00efu les dades d\u2019exemple per les dades de la vostra votaci\u00f3, mantenint la fila de cap\u00e7alera i l\u2019ordre de les columnes.
poll_import_requirements_step3=Deixeu el camp buit per a usar els mateixos valors per defecte en la forma manual. Les dates usen el format del vostre compte o yyyy-MM-dd i les hores HH\:mm.
poll_import_requirements_step4=Codes de visibilitat dels resultatS\: 1\=oberta, 2\=despr\u00e9s que els participants que han votat o de la data de tancament, 3\=despr\u00e9s de la data de tancament, 4\=mai.
poll_import_requirements_step5=Cada votaci\u00f3 ha de tenir com a m\u00ednim dues opcions. Les opcions m\u00ednimes i m\u00e0ximes han d\u2019encaixar dins del nombre d\u2019opcions introdu\u00eft.
poll_import_requirements_step6=Useu l\u2019opcio espai per a publicar la votaci\u00f3 a l\u2019espai sencer o grup per restringir-la a un o m\u00e9s grups. Quan useu grups configureu a la columna seg\u00fcent el nom del grup o els noms del grups separats per comes (cal posar el nom entre cometes si cont\u00e9 comes). Els noms de grup no han de contenir comes ni cometes\: si els contenen, afegiu-los manualment despr\u00e9s de la importaci\u00f3. 
