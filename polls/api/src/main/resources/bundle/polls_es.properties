poll_import_title=Crear encuestas por lotes
poll_import_header=Sube un archivo o escribe en el cuadro de texto las encuestas que quieras crear
poll_import_requirements=Requisitos del fichero formato de los datos del cuadro de texto
poll_import_requirements_step1=La primera fila debe contener los encabezados de las columnas. Cada fila siguiente representa una encuesta con estas columnas en el siguiente orden\: pregunta, descripci\u00f3n, acceso, grupos, fecha de apertura, hora de apertura, fecha de cierre, hora de cierre, opciones m\u00ednimas, opciones m\u00e1ximas, visibilidad de los resultados, opci\u00f3n 1, opci\u00f3n 2, ...
poll_import_requirements_step2=Descarga el fichero de ejemplo que aparece a continuaci\u00f3n y util\u00edzalo como plantilla. Sustituye los datos de ejemplo por los datos de tu propia encuesta, manteniendo la fila de encabezado y el orden de las columnas.
poll_import_requirements_step3=Deja un campo en blanco para utilizar los mismos valores predeterminados que en el formulario. Las fechas se muestran seg\u00fan el formato de fecha de tu idioma o en el formato yyyy-MM-dd, y las horas en el formato HH\:mm.
poll_import_requirements_step4=C\u00f3digos de visibilidad de resultados\: 1\=abierto, 2\=despu\u00e9s de que los estudiantes hayan votado o despu\u00e9s de la fecha de cierre, 3\=despu\u00e9s de la fecha de cierre, 4\=nunca.
poll_import_requirements_step5=Cada encuesta debe tener al menos dos opciones. El n\u00famero m\u00ednimo y m\u00e1ximo de opciones debe estar comprendido dentro del n\u00famero de opciones introducidas.
poll_import_requirements_step6=Utiliza 'site' para publicar la encuesta en todo el sitio, o 'group' para restringirla a uno o varios grupos. Si utilizas 'group', introduce en la siguiente columna el nombre del grupo o los nombres de los grupos separados por comas (pon el valor entre comillas si contiene comas). Los nombres de los grupos no deben contener comas ni comillas; si las contienen, a\u00f1\u00e1delas manualmente tras la importaci\u00f3n.
