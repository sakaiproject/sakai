<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(#{video.training.credentials})}"></head>
<body class="Mrphs-toolBody sakai-video-training">
<div class="Mrphs-sakai-video-training portletBody container-fluid sakai-video-training">
    <div th:replace="~{fragments/common :: messages(${success}, ${error})}"></div>

    <div class="vt-page-header">
        <h1 class="h3" th:text="#{video.training.credentials}">OAuth credentials</h1>
        <p class="vt-page-subtitle" th:text="#{video.training.credentials.subtitle}">Configure encrypted OAuth credentials for external video providers.</p>
    </div>

    <form class="vt-video-form" method="post" th:action="@{/credentials}">
        <div class="row g-4">
            <div class="col-12 col-lg-6">
                <div class="card h-100">
                    <div class="card-header">
                        <h2 class="h5 mb-0">YouTube</h2>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label" for="youtubeClientId" th:text="#{video.training.credentials.clientId}">Client ID</label>
                            <input class="form-control" id="youtubeClientId" name="youtubeClientId" type="text" th:value="${youtubeCredentials.clientId}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="youtubeClientSecret" th:text="#{video.training.credentials.clientSecret}">Client secret</label>
                            <input class="form-control" id="youtubeClientSecret" name="youtubeClientSecret" type="password" th:value="${youtubeCredentials.clientSecret}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" th:text="#{video.training.credentials.refreshToken}">Refresh token</label>
                            <input class="form-control" type="password" th:value="${youtubeCredentials.refreshToken}" readonly disabled>
                            <div class="form-text" th:text="#{video.training.credentials.youtube.authorization.link(@{/credentials/youtube/connect})}"></div>
                        </div>
                        <div class="d-flex flex-wrap gap-2 align-items-center">
                            <a class="btn btn-outline-secondary" th:if="${youtubeAuthorizationReady}" th:href="@{/credentials/youtube/connect}" th:text="#{video.training.credentials.youtube.authorize}">Authorize with Google</a>
                            <span class="badge bg-success" th:if="${youtubeCredentials.refreshToken != null and !#strings.isEmpty(youtubeCredentials.refreshToken)}" th:text="#{video.training.credentials.youtube.authorized}">Connected</span>
                            <span class="badge bg-secondary" th:if="${youtubeCredentials.refreshToken == null or #strings.isEmpty(youtubeCredentials.refreshToken)}" th:text="#{video.training.credentials.youtube.notAuthorized}">Not connected</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div class="mt-4 d-flex gap-2">
            <button class="btn btn-primary" type="submit" th:text="#{video.training.form.submit}">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{/videos}" th:text="#{video.training.back}">Back</a>
        </div>
    </form>
</div>
<div th:replace="~{fragments/common :: jQuery}"></div>
</body>
</html>
