<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(#{video.training.uploadJobs})}"></head>
<body class="Mrphs-toolBody sakai-video-training">
<div class="Mrphs-sakai-video-training portletBody container-fluid sakai-video-training">
    <div th:replace="~{fragments/common :: menu('upload-jobs', ${canManage}, ${canAnalytics}, ${canView})}"></div>
    <div th:replace="~{fragments/common :: messages(${success}, ${error})}"></div>

    <div class="vt-page-header">
        <h1 class="h3" th:text="#{video.training.uploadJobs}">Upload jobs</h1>
        <p class="vt-page-subtitle" th:text="#{video.training.uploadJobs.subtitle}">Recent uploads and transcoding jobs.</p>
        <div class="mt-3" th:if="${isAdmin}">
            <a class="btn btn-primary" th:href="@{/credentials}" th:text="#{video.training.credentials}">OAuth credentials</a>
        </div>
    </div>

    <div class="table-responsive" th:if="${!#lists.isEmpty(jobs)}">
        <table class="table table-striped table-hover align-middle">
            <thead>
            <tr>
                <th scope="col" th:text="#{video.training.form.title}">Title</th>
                <th scope="col" th:text="#{video.training.form.provider}">Provider</th>
                <th scope="col" th:text="#{video.training.job.status}">Status</th>
                <th scope="col" th:text="#{video.training.uploadJobs.submitted}">Submitted</th>
                <th scope="col" th:text="#{video.training.uploadJobs.updated}">Updated</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="jobView : ${jobs}">
                <td>
                    <a th:href="@{/videos/{id}(id=${jobView.video.id})}" th:text="${jobView.video.title}">Video title</a>
                    <div class="text-muted small" th:if="${jobView.errorMessage}" th:text="${jobView.errorMessage}">Error message</div>
                </td>
                <td th:text="${jobView.video.providerType}">HLS_UPLOAD</td>
                <td th:text="${jobView.statusLabel}">Processing</td>
                <td th:text="${jobView.createdOnDisplay}">Submitted time</td>
                <td th:text="${jobView.modifiedOnDisplay}">Updated time</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="sak-banner-info" role="status" th:if="${#lists.isEmpty(jobs)}" th:text="#{video.training.uploadJobs.empty}">No upload processing jobs yet.</div>

    <a class="btn btn-secondary" th:href="@{/videos}" th:text="#{video.training.back}">Back</a>
</div>
<div th:replace="~{fragments/common :: jQuery}"></div>
</body>
</html>
