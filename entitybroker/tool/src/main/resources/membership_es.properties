# this defines the entity description for membership
membership=Representa una membres\u00eda de un usuario a una ubicaci\u00f3n (sitio, grupo, etc.) en el sistema; funciona con las entidades de sitio/grupo y las entidades de usuario. En la documentaci\u00f3n que figura a continuaci\u00f3n, un identificador de pertenencia es una cadena con el formato USER_ID\:\:LOCATION_REFERENCE (por ejemplo, "aaronz\:\:site\:mySiteId").
membership.view.new=(POST) A\u00f1ade la membres\u00eda especificada por el ID. Como alternativa, una solicitud POST a la URL sencilla "/membership" puede especificar los par\u00e1metros de solicitud "userId" y "locationReference". En cualquiera de los dos casos, los par\u00e1metros de solicitud opcionales son\: la cadena "memberRole" (el valor predeterminado para las membres\u00edas a sitios a los que se puede unirse es el rol predeterminado de joiner); el valor booleano "active" (el valor predeterminado es "true"). Se puede realizar una adici\u00f3n por lotes a la misma ubicaci\u00f3n utilizando el mismo rol especificando el par\u00e1metro "userIds" (un array de IDs de usuario).
membership.view.delete=(DELETE) Elimina la suscripci\u00f3n especificada por el ID. Se pueden eliminar varias suscripciones desde el mismo lugar especificando el par\u00e1metro "userIds" (un array de IDs de usuario).
membership.view.edit=(POST) Modificar la membres\u00eda por medio del ID. De manera alternativa puede hacer uso de una petici\u00f3n POST a la URL "/membership" y especificando los par\u00e1metros "userId" y "locationReference". En cualquier caso los par\u00e1metros \u00f3ptimos son\: "memberRole" string; "active" Boolean. Puede realizar un actualizaci\u00f3n en lotes a la misma ubicaci\u00f3n usando el mismo rol y valores si especifica un par\u00e1metro "userIds" (un vector de IDs de usuarios).
membership.view.list=Por defecto, obtiene una lista de todas las membres\u00edas a sitios del usuario actual. Par\u00e1metros de consulta opcionales\: "includeSites\=false" excluye las pertenencias a sitios; "includeGroups\=true" recupera las pertenencias a grupos; "_locationReference\=LOCATION_REFERENCE" devuelve todas las membres\u00edas del sitio o grupo especificado; "user\=USER_ID" (o "userId\=USER_ID" o "_userReference\=USER_REFERENCE") devuelve las membres\u00edas del usuario indicado; "includeMemberDetails\=true" para mostrar los detalles completos del miembro correspondientes \u00fanicamente al rol del usuario; no se puede utilizar junto con "includeGroups\=true"; "role\=ROLE_STRING" (o "roleId\=ROLE_STRING") restringe la lista al rol de miembro especificado.
membership.action.site=El formato de la URL es "/membership/site/\:SITE_ID\:". <br/> (GET) devolver\u00e1 todas las membres\u00edas del sitio especificado. <br/> (POST) a\u00f1adir\u00e1 una o m\u00e1s membres\u00edas al sitio mediante una matriz de par\u00e1metros de solicitud "userSearchValues" (cada uno de los cuales es un ID de usuario, un EID de usuario o una direcci\u00f3n de correo electr\u00f3nico), junto con una cadena "memberRole" (el valor por defecto para las membres\u00edas a sitios a los que se puede unirse es el rol predeterminado de miembro) y un valor booleano "active" (el valor por defecto es 'true'). Los encabezados de respuesta pueden incluir "x-warning-not-found" (para una lista de userSearchValues no v\u00e1lidos) y "x-warning-already-members" (para una lista de userSearchValues que ya eran miembros del sitio).
membership.action.sitebyjson=El formato de la URL es "/membership/sitebyjson/\:SITE_ID\:". <br/> (POST) a\u00f1adir\u00e1 una o m\u00e1s matriculaciones a trav\u00e9s de un fragmento de JSON proporcionado en el par\u00e1metro 'json' de la petici\u00f3n.<br/> <br/>El JSON tienen que tener este formato\: <br/> <br/>[ {"id"\: "user1", "role"\: "access"}, {"id"\: "user2","role"\: "maintain"} ]<br/> <br/> Se pondr\u00e1n tres encabezados en la respuesta\:<br/> <br/><b>x-success-count</b>, que tiene el n\u00famero de matr\u00edculas con \u00e9xito<br/> <b>x-warning-not-found</b>, que contiene una lista separada por comas con los id de usuario que no existen<br/>  <b>x-warning-already-members</b>, que contiene una lista separadas por comas de los usuarios que ya est\u00e1n en el sitio
membership.action.group=El formato de la URL es "/membership/group/\:groupId\:".<br/> (GET) devolver\u00e1 todas las membres\u00edas de un grupo. <br/>(POST) actualizar\u00e1 la membres\u00eda de los usuarios al grupo. Par\u00e1metros POST obligatorios\: 'userIds', una lista de usuarios (eid o id) separados por comas. 'action' puede tener los siguientes valores\: update, add o remove. Si es update, se sustituye la pertenencia actual por la lista proporcionada. Si es add, se a\u00f1ade la lista a la pertenencia existente; si es remove, se elimina la lista de la pertenencia existente.
membership.action.join=Permite a un usuario sin permisos agregarse a este sitio. Funciona solamente con el usuario actual\: /membership/join/site/siteId
membership.action.unjoin=Permite a un usuario sin permisos desvincularse de este sitio. Funciona solamente con el usuario actual\: /membership/unjoin/site/siteId
membership.action.fastroles=Permite recuperar el rol actual en un sitio de forma r\u00e1pida. Usa el formato "/membership/fastroles/\:userId\:" (o userEid) o el usuario actual si no se especifica ninguno. Una versi\u00f3n corta de includeMemberDetail\=false.
