<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html rsf:id="html" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="CACHE-CONTROL" content="NO-CACHE" />
<script rsf:id="scr=portal-matter" src="/library/js/headscripts.js"></script>
<link rsf:id="scr=portal-matter" href="/library/skin/tool_base.css" type="text/css" rel="stylesheet" media="all" />
<link rsf:id="scr=portal-matter" href="/library/skin/default-skin/tool.css" type="text/css" rel="stylesheet" media="all" />
<title rsf:id="msg=simplepage.page.chooser"></title>
</head>
<body rsf:id="scr=sakai-body">
  <div class="portletBody PagePicker" role="main">
    <h2 rsf:id="site-dropdown-title"></h2>
    <div id="sitePicker" class="page-picker-site">
      <form action="#" rsf:id="site-picker" class="page-picker-site-form">
        <input type="hidden" rsf:id="csrf2" />
        <select rsf:id="pick-site" class="form-select page-picker-site-select">
          <option rsf:id="pick-site-option:" />
        </select>
        <input type="submit" rsf:id="submitSite" class="btn btn-secondary" />
      </form>
    </div>

    <div class="page-header">
      <h1 rsf:id="title"></h1>
    </div>

    <p rsf:id="onlyseen" class="sak-banner-info"><span rsf:id="msg=simplepage.page.onlyseen"></span></p>
    <p rsf:id="sharedpageexplanation" class="sak-banner-info">
      <span class="badge rounded-pill text-bg-info page-picker-badge">
        <span class="bi bi-copy" aria-hidden="true"></span>
        <span rsf:id="msg=simplepage.sharedpage.label"></span>
      </span>
      <span rsf:id="msg=simplepage.sharedpageexplanation"></span>
    </p>

    <form action="#" rsf:id="page-picker">
      <input type="hidden" rsf:id="csrf" />
      <span rsf:id="page-span"></span>
      <ul id="active-pages" class="pageList">
        <li rsf:id="active-page:" class="page-picker-item">
          <div class="page-picker-row">
            <input type="radio" rsf:id="select" class="form-check-input page-picker-select" />
            <div class="page-picker-content">
              <span class="page-picker-title">
                <span rsf:id="page-icon" class="bi page-picker-page-icon" aria-hidden="true"></span>
                <a href="#" rsf:id="link" class="page-picker-link">
                  <span rsf:id="link-note" class="lb-offscreen"></span>
                  <span rsf:id="link-text"></span>
                  <span class="bi bi-box-arrow-up-right page-picker-preview-icon" aria-hidden="true"></span>
                </a>
              </span>
              <span class="page-picker-meta"><span rsf:id="shared" class="badge rounded-pill text-bg-info page-picker-badge"><span class="bi bi-copy" aria-hidden="true"></span><span rsf:id="shared-text"></span></span><span rsf:id="release" class="page-picker-release"><span rsf:id="release-icon" class="bi" aria-hidden="true"></span><span rsf:id="release-text"></span></span></span>
              <span rsf:id="page1">page1</span><span rsf:id="page2">page2</span>
              <span rsf:id="item1">item1</span><span rsf:id="item2">item2</span>
            </div>
          </div>
        </li>
      </ul>
      <section rsf:id="removed-section:" class="page-picker-section">
          <h3 rsf:id="heading" class="page-picker-section-heading h4"></h3>
          <ul id="removed-pages" class="pageList">
            <li rsf:id="removed-page:" class="page-picker-item">
              <div class="page-picker-row">
                <input type="radio" rsf:id="select" class="form-check-input page-picker-select" />
                <div class="page-picker-content">
                  <span class="page-picker-title">
                    <span rsf:id="page-icon" class="bi page-picker-page-icon" aria-hidden="true"></span>
                    <a href="#" rsf:id="link" class="page-picker-link">
                      <span rsf:id="link-note" class="lb-offscreen"></span>
                      <span rsf:id="link-text"></span>
                      <span class="bi bi-box-arrow-up-right page-picker-preview-icon" aria-hidden="true"></span>
                    </a>
                  </span>
                  <span class="page-picker-meta"><span rsf:id="shared" class="badge rounded-pill text-bg-info page-picker-badge"><span class="bi bi-copy" aria-hidden="true"></span><span rsf:id="shared-text"></span></span><span rsf:id="release" class="page-picker-release"><span rsf:id="release-icon" class="bi" aria-hidden="true"></span><span rsf:id="release-text"></span></span></span>
                  <span rsf:id="page1">page1</span><span rsf:id="page2">page2</span>
                  <span rsf:id="item1">item1</span><span rsf:id="item2">item2</span>
                </div>
              </div>
            </li>
          </ul>
      </section>

      <input type="hidden" rsf:id="item-id" id="item-id" />
      <hr rsf:id="hr" class="page-picker-separator" />
      <div rsf:id="options" class="page-picker-options">
        <div class="form-check">
          <input type="checkbox" class="form-check-input" name="subpage-next" id="subpage-next" rsf:id="subpage-next" />
          <label class="form-check-label" for="subpage-next"><span rsf:id="msg=simplepage.subpage-next"></span></label>
        </div>
        <div class="form-check">
          <input type="checkbox" class="form-check-input" name="subpage-button" id="subpage-button" rsf:id="subpage-button" />
          <label class="form-check-label" for="subpage-button"><span rsf:id="msg=simplepage.subpage-button"></span></label>
        </div>
      </div>
      <p class="act">
        <input type="hidden" rsf:id="addBefore" />
        <input type="submit" class="btn btn-primary" rsf:id="submit" />
        <input type="submit" class="btn btn-secondary" rsf:id="cancel" />
      </p>
    </form>
  </div>
</body>
</html>
