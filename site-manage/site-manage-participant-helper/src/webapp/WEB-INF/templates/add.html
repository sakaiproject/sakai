<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.toLanguageTag()}">
<head th:replace="~{fragments/common :: head(#{java.addp})}"></head>
<body>
  <main class="portletBody participant-helper" id="participant-helper">
    <div th:replace="~{fragments/common :: header}"></div>
    <div th:replace="~{fragments/common :: steps(1)}"></div>
    <div th:replace="~{fragments/common :: messages}"></div>

    <div th:if="${showCourseInstructions}" class="sak-banner-info">
      <strong th:text="#{add.official}">Students Registered for Course</strong>
      <p class="mb-0" th:text="#{add.official.instruction}">Course roster instructions.</p>
    </div>

    <form th:if="${allowAddParticipant}" th:action="@{/add}" th:object="${addForm}" method="post" class="participant-helper-form" novalidate>
      <input type="hidden" th:field="*{csrfToken}">
      <section aria-labelledby="official-participants-heading">
        <h2 id="official-participants-heading" class="h4" th:text="#{officialAccountSectionTitle}">Official Participants</h2>
        <label class="form-label" for="officialAccountParticipant" th:text="#{officialAccountLabel}">Official Email Address or Username</label>
        <textarea class="form-control" id="officialAccountParticipant" th:field="*{officialAccountParticipant}" rows="5" aria-describedby="official-account-help"></textarea>
        <div id="official-account-help" class="form-text" th:text="#{add.multiple}">Enter multiple usernames, one per line.</div>
      </section>

      <section th:if="${allowNonOfficialAccount}" class="mt-4" aria-labelledby="non-official-participants-heading">
        <h2 id="non-official-participants-heading" class="h4" th:text="#{nonOfficialAccountSectionTitle}">Non-official Participants</h2>
        <label class="form-label" for="nonOfficialAccountParticipant" th:text="#{nonOfficialAccountLabel}">Email Address of Non-official Participant</label>
        <textarea class="form-control" id="nonOfficialAccountParticipant" th:field="*{nonOfficialAccountParticipant}" rows="5" aria-describedby="non-official-account-help"></textarea>
        <div id="non-official-account-help" class="form-text" th:text="#{add.multiple.nonofficial}">Enter one guest per line.</div>
      </section>

      <fieldset th:if="${showStatusChoice}" class="mt-4">
        <legend class="h4" th:text="#{participant.status}">Participant Status</legend>
        <div class="form-check">
          <input class="form-check-input" type="radio" th:field="*{statusChoice}" id="status-active" value="active">
          <label class="form-check-label" for="status-active" th:text="#{sitegen.siteinfolist.active}">Active</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" th:field="*{statusChoice}" id="status-inactive" value="inactive">
          <label class="form-check-label" for="status-inactive" th:text="#{sitegen.siteinfolist.inactive}">Inactive</label>
        </div>
      </fieldset>

      <div class="participant-helper-actions mt-4">
        <button type="submit" class="btn btn-primary" th:text="#{gen.continue}">Continue</button>
        <div th:replace="~{fragments/common :: cancel}"></div>
      </div>
    </form>
  </main>
</body>
</html>
