<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.toLanguageTag()}">
<head th:replace="~{fragments/common :: head(#{addnoti.anemail})}"></head>
<body>
  <main class="portletBody participant-helper" id="participant-helper">
    <div th:replace="~{fragments/common :: header}"></div>
    <div th:replace="~{fragments/common :: steps(3)}"></div>
    <div th:replace="~{fragments/common :: messages}"></div>
    <p th:text="#{addnoti.anemail}">An email can be sent to added users.</p>
    <form th:action="@{/notifications}" th:object="${emailNotificationForm}" method="post" class="participant-helper-form" novalidate>
      <input type="hidden" th:field="*{csrfToken}">
      <fieldset>
        <legend class="visually-hidden" th:text="#{addnoti.anemail}">Email notification</legend>
        <div class="form-check">
          <input class="form-check-input" type="radio" th:field="*{emailNotiChoice}" id="send-email" value="true">
          <label class="form-check-label" for="send-email" th:text="#{addnoti.sendnow}">Send now</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" th:field="*{emailNotiChoice}" id="dont-send-email" value="false">
          <label class="form-check-label" for="dont-send-email" th:text="#{addnoti.dontsend}">Don't send</label>
        </div>
      </fieldset>
      <div class="participant-helper-actions mt-4">
        <button type="submit" class="btn btn-primary" th:text="#{gen.continue}">Continue</button>
        <button type="submit" class="btn btn-outline-secondary" th:formaction="@{/notifications/back}" formmethod="post" th:text="#{gen.back}">Back</button>
        <div th:replace="~{fragments/common :: cancel}"></div>
      </div>
    </form>
  </main>
</body>
</html>
