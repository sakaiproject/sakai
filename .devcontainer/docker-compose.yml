# Override for VS Code / Codespaces: add a lightweight "dev" workspace and
# skip building the full Sakai runtime image unless profile "full-image" is set.
services:
  sakai:
    profiles: ["full-image"]

  dev:
    image: mcr.microsoft.com/devcontainers/base:jammy
    volumes:
      - ..:/workspaces/sakai:cached
      - maven-cache:/home/vscode/.m2
    command: sleep infinity
    networks:
      - sakai
    depends_on:
      db:
        condition: service_healthy

volumes:
  maven-cache:
