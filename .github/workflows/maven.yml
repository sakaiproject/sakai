# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Maven Build

on:
  pull_request:

concurrency:
  group: maven-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  locale-tests:
    name: Maven tests (${{ matrix.language }}_${{ matrix.country }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: en
            country: US
          - language: es
            country: ES
    runs-on: ubuntu-24.04
    env:
      MAVEN_VERSION: 3.9.16
      MAVEN_ARGS: -Dmaven.repo.local=${{ github.workspace }}/.m2/repository
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 21
          distribution: temurin
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: ${{ env.MAVEN_VERSION }}

      - name: Restore master Maven repository cache
        uses: actions/cache/restore@v6.1.0
        with:
          # Relative paths and cross-OS archives let all runners share this repository.
          path: .m2/repository
          enableCrossOsArchive: true
          key: sakai-m2-master-maven-${{ env.MAVEN_VERSION }}
          restore-keys: sakai-m2-master-maven-${{ env.MAVEN_VERSION }}-

      - name: Search for bad unicode translations
        run: |
          find . -name \*.properties -exec grep '\\u[0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][^0-9a-fA-F]' {} \; &> grep.txt
          find . -name \*.properties -exec grep '\\u[0-9a-fA-F][0-9a-fA-F][^0-9a-fA-F][0-9a-fA-F]' {} \; &>> grep.txt
          find . -name \*.properties -exec grep '\\u[0-9a-fA-F][^0-9a-fA-F][0-9a-fA-F][0-9a-fA-F]' {} \; &>> grep.txt
          find . -name \*.properties -exec grep '\\u[^0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F]' {} \; &>> grep.txt
          if [ -s grep.txt ]; then
            exit 1
          fi
      - name: Run tests
        env:
          JAVA_TOOL_OPTIONS: -Duser.language=${{ matrix.language }} -Duser.country=${{ matrix.country }}
          MAVEN_OPTS: -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true -Dmaven.wagon.http.retryHandler.count=2 -Dmaven.wagon.http.pool=true
        run: mvn -V -B -ntp -PskipBrokenTests test
