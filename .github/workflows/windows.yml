# Build and test Sakai on Windows.

name: Windows Build

on:
  pull_request:

concurrency:
  group: windows-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  maven-build:
    runs-on: windows-latest
    env:
      MAVEN_ARGS: -Dmaven.repo.local=${{ github.workspace }}/.m2/repository
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7.0.1
      - name: JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 17
          distribution: temurin
      - name: Restore master Maven repository cache
        uses: actions/cache/restore@v6.1.0
        with:
          # Relative paths and cross-OS archives let all runners share this repository.
          path: .m2/repository
          enableCrossOsArchive: true
          key: sakai-m2-master
          restore-keys: sakai-m2-master-

      - name: Build with Maven
        env:
          MAVEN_OPTS: -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true -Dmaven.wagon.http.retryHandler.count=2 -Dmaven.wagon.http.pool=true
        run: mvn -V -B -ntp "-Dsakai.test.forks=2" -PskipBrokenTests test
