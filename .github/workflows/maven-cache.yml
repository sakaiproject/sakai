# Seed a shared Maven repository cache for pull requests targeting master.

name: Maven Repository Cache

on:
  push:
    branches: [master]

concurrency:
  group: maven-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm-maven-cache:
    runs-on: ubuntu-24.04
    env:
      MAVEN_ARGS: -Dmaven.repo.local=${{ github.workspace }}/.m2/repository
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7.0.1

      - name: JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          java-version: 21
          distribution: temurin
          # GitHub-hosted runners share egress that Maven Central rate-limits.
          # Mirror only central. Sakai, Shibboleth, CodeLibs, and snapshot repositories stay on their own URLs.
          mvn-mirrors: google-maven-central:https://maven-central.storage-download.googleapis.com/maven2/:central

      - name: Node 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Restore Maven local repository cache
        id: cache-maven-restore
        uses: actions/cache/restore@v6.1.0
        with:
          # Relative paths and cross-OS archives let all runners share this repository.
          path: .m2/repository
          enableCrossOsArchive: true
          key: sakai-m2-master-maven-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sakai-m2-master-maven-

      - name: Populate Maven local repository
        run: mvn -B -ntp -V -DskipTests -Denforcer.skip -Dmaven.source.skip install

      - name: Resolve Playwright dependencies
        run: mvn -B -ntp -V -Pe2e -DskipTests test

      - name: Resolve shared deployment dependencies
        run: mvn -B -ntp -pl deploy dependency:resolve

      - name: Save Maven local repository cache
        uses: actions/cache/save@v6.1.0
        with:
          path: .m2/repository
          enableCrossOsArchive: true
          key: ${{ steps.cache-maven-restore.outputs.cache-primary-key }}
