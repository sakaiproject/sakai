<?xml version="1.0" encoding="UTF-8" ?>
<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:panel>
	<div wicket:id="overlay" class="gb-modal-overlay">
		<div wicket:id="dialog" class="gb-modal-dialog" role="dialog" aria-modal="true">
			<div class="gb-modal-titlebar">
				<span wicket:id="title" class="gb-modal-title"></span>
				<a wicket:id="close" class="gb-modal-close" href="#" wicket:message="aria-label:button.close"><span aria-hidden="true">&#10005;</span></a>
			</div>
			<div wicket:id="content" class="gb-modal-content">
			</div>
		</div>
	</div>
</wicket:panel>
</body>
</html>
