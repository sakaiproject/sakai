apply=Apply updates
apply.description=Set to true to update Gradebook item names. The default false only logs a dry-run summary.
site.id=Site ID
site.id.description=Optional site/gradebook UID to limit the backfill to one site. Leave blank to scan all sites.
log.changes=Log changed rows
log.changes.description=Set to true to log each row whose Gradebook title differs from the decoded Samigo title.
