apply=Apply updates
apply.description=Set to true to update Gradebook item names. The default false only logs a dry-run summary.
site.id=Site ID
site.id.description=Optional site/gradebook UID to limit the scan to one site. Recommended for large systems. Leave blank to scan all sites in batches.
log.changes=Log changed rows
log.changes.description=Set to true to log each Samigo external Gradebook row whose stored title differs from the decoded published assessment title.
