example_fn_label=Resposta num\u00e9rica
example_fn_instructions=La resposta correcta ha d\u2019anar envoltada de claus i precedida d\u2019un asterisc \u2014\u00ab*{ }\u00bb\u2014, envoltant el(s) valor(s) num\u00e8ric(s) que requereix(en) un camp de resposta en blanc. Exemple\: 3*3\=*{9}.
example_fn_instructions1=Interval\: Inseriu una barra vertical \u00ab|\u00bb entre un interval de valors. Exemple\: El preu \u00e9s *{12.2|14.5}. La resposta de l\u2019estudiant, si es troba entre 12,2 i 14,5, es considerar\u00e0 v\u00e0lida.
example_fn_instructions2=Notaci\u00f3 cient\u00edfica\: es pot utilitzar un punt o una coma com a separador decimal, i la lletra \u00abE\u00bb o \u00abe\u00bb per a l\u2019exponent. Exemple\: *{6.022E23} per expressar el nombre d\u2019Avogadro.
example_fn_instructions3=Els nombres complexos han de tenir la forma *{a + bi}, on els valors de \u00aba\u00bb i \u00abb\u00bb han d\u2019estar indicats expl\u00edcitament. Per exemple, *{1+1i} \u00e9s v\u00e0lid, mentre que *{1+i} no ho \u00e9s. De la mateixa manera, *{0+9i} \u00e9s v\u00e0lid, mentre que *{9i} no ho \u00e9s.
