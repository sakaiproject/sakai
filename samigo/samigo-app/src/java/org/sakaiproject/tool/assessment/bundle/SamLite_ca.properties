rich_text_label=Mostra l\u2019editor de text enriquit (i el recompte de car\u00e0cters)
rich_editor_instructions_label=Instruccions per a l\u2019editor de text enriquit
rich_editor_instructions_prelude=Aquest editor accepta diferents etiquetes html en crear preguntes, de manera que es poden crear textos en negreta o cursiva, i afegir-hi subratllats, imatges i altres possibilitats.
rich_editor_instructions_prelude_2=Per a fer \u00fas d\u2019aquest editor cal tenir en compte diversos aspectes\:
rich_editor_instructions_recomendation_1=Es recomana que si teniu previst afegir estils addicionals els useu des de l\u2019inici, perqu\u00e8 llavors al fer el canvi tot es combina en una sola l\u00ednia
rich_editor_instructions_recomendation_2=Els estils addicionals nom\u00e9s s\u2019aplicaran als t\u00edtols de les preguntes, els comentaris o les respostes de preguntes m\u00faltiples, en altres casos no tindran efecte
rich_editor_instructions_recomendation_3=No es poden usar en la definici\u00f3 de la pregunta ('Pregunta 5 (7 punts) (1.5 descompte)'), perqu\u00e8 causa que la pregunta no es cre\u00ef correctament.
rich_editor_instructions_recomendation_4=Quan s\u2019usa en comentaris ('\#FBOK' i '\#FBNOK') nom\u00e9s es pot fer servir despr\u00e9s de la marca de puntuaci\u00f3 '.', perqu\u00e8 usar-lo abans fa que no s\u2019apliqui correctament
rich_editor_instructions_recomendation_5=Quan s\u2019usa per a respostes ('a. Resposta' o '*b. Resposta correcta') nom\u00e9s es pot fer servir comen\u00e7ant a la marca de puntuaci\u00f3 '.', perqu\u00e8 fer-lo servir abans fa que no s\u2019apliqui correctament
samlite_questiontext_empty=El text de la pregunta no pot estar buit
