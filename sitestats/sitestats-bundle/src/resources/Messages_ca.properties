overview_help_submissions_on_time=Lliurat abans o en la data l\u00edmit. S\u2019exclouen els elements encara oberts. El percentatge es refereix als elements tancats. Abarca tot el per\u00edode.
overview_help_submissions_late=Lliurat despr\u00e9s de la data l\u00edmit, o marcat com a lliurat fora de termini. Se n\u2019exclouen els elements encara oberts. El percentatge es refereix als elements tancats. Abarca tot el per\u00edode.
overview_help_submissions_missed=No s\u2019ha lliurat despr\u00e9s de la data de tancament o, si no n\u2019hi ha, de la data l\u00edmit. S\u2019exclouen els elements que encara estan oberts. El percentatge es refereix als elements tancats. Abarca tot el per\u00edode.
overview_help_submissions_needs_grading=Elements lliurats que encara necessiten ser qualificats, mostrats com elements  a qualificar / elements lliurats. Abarca tot el per\u00edode.
overview_help_submissions_at_risk=Estudiants amb almenys una activitat o q\u00fcestionari no lliurat despr\u00e9s de la seva data de tancament, o de la seva data l\u00edmit si no hi ha data de tancament. Abarca tot el per\u00edode.
overview_help_submissions_avg_delay=Nom\u00e9s lliurament fora de termini. Mediana de emps despr\u00e9s de la data de venciment per a lliuraments fora de termini amb un retard positiu mesurable. S\u2019exclouen els lliuraments fora de termini puntuals, perduts i sense retard. Cobreix tot el temps.
overview_help_submissions_on_time_own=Els vostres lliuraments realitzats en la data l\u00edmit o abans. S\u2019exclouen els elements encara oberts. El percentatge es refereix als vostres elements tancats. Abarca tot el per\u00edode.
overview_help_submissions_late_own=Els vostres lliuraments despr\u00e9s de la data de venciment o marcats com a fora de termini. Els elements que encara estan oberts s\u2019exclouen. El percentatge \u00e9s dels vostres elements tancats. Cobreix tot el temps.
overview_help_submissions_missed_own=Els vostres elements no presentats despr\u00e9s de la data de tancament, o de la data l\u00edmit si no hi ha data de tancament. Se n\u2019exclouen els elements que encara estan oberts. Abarca tot el per\u00edode.
overview_help_submissions_avg_delay_own=Nom\u00e9s lliuraments fora de termini. Mediana de temps transcorregut des de la data l\u00edmit per als lliuraments fora de termini que presenten un retard positiu mesurable. S\u2019exclouen els lliuraments fets a temps, els no realitzats i els lliuraments fora de termini sense retard (retard zero). Abarca tot el per\u00edode.
overview_help_grades_graded=Nombre de cel\u00b7les \u00abestudiant-\u00edtem\u00bb respecte al total de cel\u00b7les esperades en els \u00edtems de Qualificacions que s\u2019han tingut en compte. Els elements amb justificaci\u00f3 queden exclosos. Abarca tot el per\u00edode.
overview_help_grades_complete=Estudiants que tenen una nota per a cada element de Qualificacions que s\u2019espera que es comptabilitzi. Abarca tot el per\u00edode.
overview_help_grades_average=Mitjana del percentatge (punts obtinguts respecte als possibles) de cada estudiant avaluat en els elements de Qualificacions que es tenen en compte. S\u2019exclouen els estudiants sense qualificacions. Inclou tot el per\u00edode.
overview_help_grades_below_threshold=Estudiants que tinguin uns punts obtinguts/possibles en treballs qualificats i no justificats de Qualificacions inferiors al {0}%. Els estudiants sense qualificacions queden exclosos. Cobreix tot el temps.
overview_help_grades_graded_own=Els vostres elements avaluats de Qualificacions, en relaci\u00f3 amb el total d\u2019elements previstos en el vostre cas. Els elements justificats queden exclosos. Abarca tot el per\u00edode.
overview_help_grades_complete_own=Punts obtinguts respecte al total de punts possibles en elements avaluables de Qualificacions (excloent-ne els elements excusats). Inclou tot el per\u00edode.
overview_help_grades_below_threshold_own=Si el percentatge obtingut o possible en les tasques avaluades i no excloses de Qualificacions \u00e9s inferior al {0} %. Se n\u2019exclouen les tasques no avaluades. Abarca tot el per\u00edode.
overview_help_communication_authored=Fils de f\u00f2rum originals, temes de conversa, publicacions a l\u2019espai com\u00fa i missatges privats que heu iniciat o b\u00e9 ho han fet altres membres de l\u2019espai. Inclou tot el per\u00edode.
