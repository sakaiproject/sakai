<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${locale}">
<head th:replace="~{fragments/common :: head(#{menu_reports})}"></head>
<body>
<main class="portletBody container-fluid">
  <div th:replace="~{fragments/common :: menu('reports')}"></div>
  <div th:replace="~{fragments/common :: messages}"></div>
  <h1 class="h3 mt-3" th:text="${reportForm.id > 0} ? 'Edit report' : 'Add report'">Edit report</h1>
  <form method="post" th:action="@{/reports/save}" th:object="${reportForm}" class="mw-100" style="max-width: 60rem">
    <input type="hidden" name="siteId" th:value="${siteId}"/><input type="hidden" th:field="*{id}"/>
    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <div id="report-error" class="sak-banner-error mb-3" role="alert" th:if="${error}" th:text="${error}"></div>
    <div class="mb-3" th:if="${reportForm.id == 0 and !#lists.isEmpty(templates)}"><label class="form-label" for="template-id">Report type</label><select id="template-id" class="form-select" th:field="*{templateId}"><option th:each="template : ${templates}" th:value="${template.id}" th:text="${template.title}"></option></select></div>

    <fieldset class="border rounded p-3 mb-4"><legend class="float-none w-auto px-2 h4" th:text="#{report_what}">What?</legend><p th:text="#{report_what_instructions}"></p>
      <div class="mb-3"><label class="form-label" for="report-what" th:text="#{report_what_activity}">Activity</label><select id="report-what" class="form-select" th:field="*{what}"><option value="what-visits" th:text="#{report_what_visits}"></option><option value="what-events" th:text="#{report_what_events}"></option><option value="what-resources" th:text="#{report_what_resources}"></option><option value="what-presences" th:text="#{report_what_presences}"></option></select></div>
      <div class="row g-3"><div class="col-12 col-md-6"><label class="form-label" for="event-selection" th:text="#{report_what_selection}">Selection</label><select id="event-selection" class="form-select" th:field="*{whatEventSelType}"><option value="what-events-bytool" th:text="#{report_what_events_bytool}"></option><option value="what-events-byevent" th:text="#{report_what_events_byevent}"></option></select></div>
      <div class="col-12 col-md-6"><label class="form-label" for="tool-ids" th:text="#{report_what_events_bytool}">Tools</label><select id="tool-ids" class="form-select" th:field="*{whatToolIds}" multiple size="7" th:title="#{report_multiple_sel_instruction}"><option value="all" th:text="#{report_what_all}"></option><option th:each="tool : ${editorOptions.tools}" th:value="${tool.id}" th:text="${tool.label}"></option></select></div>
      <div class="col-12"><label class="form-label" for="event-ids" th:text="#{report_what_events_byevent}">Events</label><select id="event-ids" class="form-select" th:field="*{whatEventIds}" multiple size="9" th:title="#{report_multiple_sel_instruction}"><option th:each="event : ${editorOptions.events}" th:value="${event.id}" th:text="${event.label}"></option></select></div></div>
      <div class="row g-3 mt-1"><div class="col-12 col-md-6"><div class="form-check"><input id="limit-resource-action" class="form-check-input" type="checkbox" th:field="*{whatLimitedAction}"/><label class="form-check-label" for="limit-resource-action" th:text="#{report_what_resource_action}"></label></div><select class="form-select mt-2" aria-label="Resource action" th:field="*{whatResourceAction}"><option value="new" th:text="#{action_new}"></option><option value="read" th:text="#{action_read}"></option><option value="revise" th:text="#{action_revise}"></option><option value="delete" th:text="#{action_delete}"></option><option value="zipdownload" th:text="#{action_zipdownload}"></option></select></div>
      <div class="col-12 col-md-6"><div class="form-check"><input id="limit-resources" class="form-check-input" type="checkbox" th:field="*{whatLimitedResourceIds}"/><label class="form-check-label" for="limit-resources" th:text="#{report_what_sel_resources}"></label></div><textarea class="form-control mt-2" th:field="*{whatResourceIds}" rows="3" aria-label="Resource IDs" placeholder="One resource ID per line"></textarea></div></div>
    </fieldset>

    <fieldset class="border rounded p-3 mb-4"><legend class="float-none w-auto px-2 h4" th:text="#{report_when}">When?</legend><p th:text="#{report_when_instructions}"></p><label class="form-label" for="report-when" th:text="#{report_when_period}">Period</label><select id="report-when" class="form-select mb-3" th:field="*{when}"><option value="when-all" th:text="#{report_when_all}"></option><option value="when-last7days" th:text="#{report_when_last7days}"></option><option value="when-last30days" th:text="#{report_when_last30days}"></option><option value="when-last365days" th:text="#{report_when_last365days}"></option><option value="when-custom" th:text="#{report_when_custom}"></option></select><div class="row g-3"><div class="col-12 col-sm-6"><label class="form-label" for="when-from" th:text="#{report_when_from_date}">From</label><input id="when-from" class="form-control" type="date" th:field="*{whenFrom}"/></div><div class="col-12 col-sm-6"><label class="form-label" for="when-to" th:text="#{report_when_to_date}">To</label><input id="when-to" class="form-control" type="date" th:field="*{whenTo}"/></div></div></fieldset>

    <fieldset class="border rounded p-3 mb-4"><legend class="float-none w-auto px-2 h4" th:text="#{report_who}">Who?</legend><p th:text="#{report_who_instructions}"></p><label class="form-label" for="report-who" th:text="#{report_who_users}">Users</label><select id="report-who" class="form-select mb-3" th:field="*{who}"><option value="who-all" th:text="#{report_who_all}"></option><option value="who-role" th:text="#{report_who_role}"></option><option value="who-groups" th:text="#{report_who_group}"></option><option value="who-custom" th:text="#{report_who_custom}"></option><option value="who-none" th:text="#{report_who_none}"></option></select><div class="row g-3"><div class="col-12 col-md-6"><label class="form-label" for="who-role" th:text="#{report_who_role_sel}">Role</label><select id="who-role" class="form-select" th:field="*{whoRoleId}"><option value=""></option><option th:each="role : ${editorOptions.roles}" th:value="${role.id}" th:text="${role.label}"></option></select></div><div class="col-12 col-md-6"><label class="form-label" for="who-group" th:text="#{report_who_group_sel}">Group</label><select id="who-group" class="form-select" th:field="*{whoGroupId}"><option value=""></option><option th:each="group : ${editorOptions.groups}" th:value="${group.id}" th:text="${group.label}"></option></select></div><div class="col-12"><label class="form-label" for="who-users" th:text="#{report_who_custom_sel}">Custom</label><select id="who-users" class="form-select" th:field="*{whoUserIds}" multiple size="7" th:title="#{report_multiple_sel_instruction}"><option th:each="user : ${editorOptions.users}" th:value="${user.id}" th:text="${user.label}"></option></select></div></div></fieldset>

    <fieldset class="border rounded p-3 mb-4"><legend class="float-none w-auto px-2 h4" th:text="#{report_how}">How?</legend><p th:text="#{report_how_instructions}"></p><div class="row g-3"><div class="col-12 col-md-6"><label class="form-label" for="totals-by" th:text="#{report_howtotalsby}">Totals by</label><select id="totals-by" class="form-select" th:field="*{howTotalsBy}" multiple size="7" required><option value="user" th:text="#{report_option_user}"></option><option value="tool" th:text="#{report_option_tool}"></option><option value="event" th:text="#{report_option_event}"></option><option value="resource" th:text="#{report_option_resource}"></option><option value="resource-action" th:text="#{report_option_resourceaction}"></option><option value="date" th:text="#{report_option_date}"></option><option value="last-date" th:text="#{report_option_lastdate}"></option></select></div>
      <div class="col-12 col-md-6"><div class="form-check mb-2"><input id="sort-results" class="form-check-input" type="checkbox" th:field="*{howSort}"/><label class="form-check-label" for="sort-results" th:text="#{report_howsorting_enable}"></label></div><label class="form-label" for="sort-by" th:text="#{report_howsorting}">Sort by</label><select id="sort-by" class="form-select" th:field="*{howSortBy}"><option value="default" th:text="#{default}"></option><option value="event" th:text="#{report_option_event}"></option><option value="resource" th:text="#{report_option_resource}"></option><option value="resource-action" th:text="#{report_option_resourceaction}"></option><option value="date" th:text="#{report_option_date}"></option><option value="total" th:text="#{report_option_total}"></option></select><div class="form-check mt-2"><input id="sort-ascending" class="form-check-input" type="checkbox" th:field="*{howSortAscending}"/><label class="form-check-label" for="sort-ascending" th:text="#{report_howsorting_asc}"></label></div></div>
      <div class="col-12 col-md-6"><div class="form-check"><input id="limit-results" class="form-check-input" type="checkbox" th:field="*{howLimitedMaxResults}"/><label class="form-check-label" for="limit-results" th:text="#{report_howmaxresults}"></label></div><label class="form-label mt-2" for="max-results" th:text="#{report_howmaxresults_sel}">Number of results</label><input id="max-results" class="form-control" type="number" min="0" th:field="*{howMaxResults}"/></div>
      <div class="col-12 col-md-6"><label class="form-label" for="presentation" th:text="#{report_howpresentation}">Presentation</label><select id="presentation" class="form-select" th:field="*{howPresentationMode}"><option value="how-presentation-table" th:text="#{report_howpresentation_table}"></option><option value="how-presentation-chart" th:text="#{report_howpresentation_chart}"></option><option value="how-presentation-both" th:text="#{report_howpresentation_both}"></option></select></div>
      <div class="col-12 col-md-4"><label class="form-label" for="chart-type" th:text="#{report_howcharttype}">Chart type</label><select id="chart-type" class="form-select" th:field="*{howChartType}"><option value="bar" th:text="#{report_howchart_bar}"></option><option value="pie" th:text="#{report_howchart_pie}"></option><option value="timeseries" th:text="#{report_howchart_timeseries}"></option><option value="timeseriesbar" th:text="#{report_howchart_timeseries_bar}"></option></select></div>
      <div class="col-12 col-md-4"><label class="form-label" for="chart-source" th:text="#{report_howdatasource}">Chart data source</label><select id="chart-source" class="form-select" th:field="*{howChartSource}"><option value="user" th:text="#{report_option_user}"></option><option value="tool" th:text="#{report_option_tool}"></option><option value="event" th:text="#{report_option_event}"></option><option value="resource" th:text="#{report_option_resource}"></option><option value="resource-action" th:text="#{report_option_resourceaction}"></option><option value="date" th:text="#{report_option_date}"></option></select></div>
      <div class="col-12 col-md-4"><label class="form-label" for="chart-category" th:text="#{report_howdatasource_grouped}">Grouped by</label><select id="chart-category" class="form-select" th:field="*{howChartCategorySource}"><option value="none" th:text="#{none}"></option><option value="user" th:text="#{report_option_user}"></option><option value="tool" th:text="#{report_option_tool}"></option><option value="event" th:text="#{report_option_event}"></option><option value="resource" th:text="#{report_option_resource}"></option><option value="resource-action" th:text="#{report_option_resourceaction}"></option><option value="date" th:text="#{report_option_date}"></option></select></div>
      <div class="col-12 col-md-6"><label class="form-label" for="chart-series" th:text="#{report_howdatasource_series}">Chart series source</label><select id="chart-series" class="form-select" th:field="*{howChartSeriesSource}"><option value="total" th:text="#{report_option_total}"></option><option value="user" th:text="#{report_option_user}"></option><option value="tool" th:text="#{report_option_tool}"></option><option value="event" th:text="#{report_option_event}"></option><option value="resource" th:text="#{report_option_resource}"></option><option value="resource-action" th:text="#{report_option_resourceaction}"></option></select></div><div class="col-12 col-md-6"><label class="form-label" for="series-period">Time-series period</label><select id="series-period" class="form-select" th:field="*{howChartSeriesPeriod}"><option value="byday">Day</option><option value="byweekday">Weekday</option><option value="bymonth">Month</option><option value="byyear">Year</option></select></div></div></fieldset>

    <fieldset class="border rounded p-3 mb-4"><legend class="float-none w-auto px-2 h4" th:text="#{report_details}">Report</legend><p th:text="#{report_details_instructions}"></p><div class="mb-3"><label class="form-label" for="report-title">Title <span aria-hidden="true">*</span></label><input id="report-title" class="form-control" th:field="*{title}" required maxlength="255" th:attr="aria-invalid=${error != null},aria-describedby=${error != null ? 'report-error' : null}"/></div><div class="mb-3"><label class="form-label" for="report-description">Description</label><textarea id="report-description" class="form-control" th:field="*{description}" rows="4"></textarea></div><div class="form-check"><input id="report-hidden" class="form-check-input" type="checkbox" th:field="*{hidden}"/><label class="form-check-label" for="report-hidden">Hide this report from the normal report list</label></div></fieldset>
    <div class="d-flex flex-wrap gap-2 act"><button class="btn btn-primary" type="submit" name="action" value="save">Save report</button><button class="btn btn-outline-secondary" type="submit" name="action" value="preview">Generate report</button><a class="btn btn-link" th:href="@{/reports(siteId=${siteId})}">Cancel</a></div>
  </form>
</main>
</body>
</html>
